name: Validate knowledge kernel

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mutation_mode: ${{ steps.classify.outputs.mutation_mode }}
    steps:
      - name: Check out repository and comparison history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Classify mutation scope
        id: classify
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/ci-policy.mjs classify

  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Test CI routing and gate failures
        run: pnpm test:ci

      - name: Validate repository
        run: pnpm validate

      - name: Verify generated graph and indexes
        run: pnpm graph:check

      - name: Verify generated retrieval units
        run: pnpm retrieval:units:check

      - name: Run unit and regression tests
        run: pnpm test

      - name: Enforce coverage gates
        run: pnpm test:coverage

      - name: Verify generated integrity reports
        run: pnpm report:check

  mutation-suite:
    needs: changes
    if: ${{ needs.changes.outputs.mutation_mode == 'full' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: kernel
            config: stryker.config.json
            report: .tmp/mutation-legacy.json
          - suite: graph
            config: stryker.graph.config.json
            report: .tmp/mutation-graph.json
          - suite: retrieval
            config: stryker.retrieval.config.json
            report: .tmp/mutation-retrieval.json
          - suite: rag
            config: stryker.rag.config.json
            report: .tmp/mutation-rag.json
          - suite: decision-guide
            config: stryker.decision-guide.config.json
            report: .tmp/mutation-decision-guide.json
          - suite: decision-recommendation
            config: stryker.decision-recommendation.config.json
            report: .tmp/mutation-decision-recommendation.json
          - suite: decision-runtime
            config: stryker.decision-runtime.config.json
            report: .tmp/mutation-decision-runtime.json
    name: mutation-suite (${{ matrix.suite }})
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce mutation threshold
        run: pnpm exec stryker run ${{ matrix.config }}

      - name: Preserve mutation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ matrix.suite }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ matrix.report }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  mutation:
    needs: [changes, mutation-suite]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require complete mutation outcome
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-policy.mjs gate

  retrieval-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16-bookworm
        env:
          POSTGRES_DB: architecture_knowledge
          POSTGRES_USER: aks
          POSTGRES_PASSWORD: aks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aks -d architecture_knowledge" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      RETRIEVAL_DATABASE_URL: postgresql://aks:aks@127.0.0.1:5432/architecture_knowledge
      RETRIEVAL_EMBEDDING_PROVIDER: fake
      RETRIEVAL_DATA_CLASSIFICATION: public
      RAG_MODEL_PROVIDER: fake
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Migrate retrieval database
        run: pnpm retrieval:migrate
      - name: Build deterministic retrieval generation
        run: pnpm retrieval:index
      - name: Verify retrieval currentness
        run: pnpm retrieval:check
      - name: Run PostgreSQL retrieval integration tests
        run:
          pnpm exec vitest run tests/retrieval-database.integration.test.ts
          tests/retrieval-query.test.ts
      - name: Evaluate all retrieval modes
        run: pnpm retrieval:evaluate
      - name: Evaluate deterministic governed RAG
        run: pnpm rag:evaluate
      - name: Record informational retrieval performance
        run: pnpm retrieval:benchmark
      - name: Smoke hybrid graph query
        run:
          pnpm retrieval:query -- "What should I validate in an identity token?" --mode hybrid-graph
          --top-k 5 --json
      - name: Smoke governed RAG answer
        run:
          pnpm rag:answer -- "What issuer check is required for an OpenID Connect ID Token?" --json
      - name: Build workspace runtime and app
        run: pnpm build
      - name: Test real app HTTP retrieval and RAG against PostgreSQL
        env:
          ATLAS_TEST_DATABASE_URL: postgresql://aks:aks@127.0.0.1:5432/architecture_knowledge
        run:
          pnpm --filter architecture-knowledge-app exec vitest run
          tests/database.integration.test.ts

  atlas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm app:check
      - run: pnpm app:test:coverage
      - run: pnpm --filter architecture-knowledge-app exec playwright install --with-deps chromium
      - run: pnpm app:test:e2e
      - run: pnpm app:benchmark

  atlas-mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter architecture-knowledge-app test:mutation
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: atlas-mutation-${{ github.sha }}
          path: apps/atlas/reports/mutation.json
          if-no-files-found: error
