schema_version: 1
status: proposed
record_kinds:
  - key: concept
    id_namespace: AKC
    description: A durable knowledge node with exactly one primary concept type.
  - key: source
    id_namespace: AKS
    description: A registered evidentiary publication or specification.
  - key: claim
    id_namespace: AKL
    description: An independently traceable proposition.
  - key: relationship
    id_namespace: AKR
    description: A typed and qualified graph edge.
  - key: decision-guide
    id_namespace: AKG
    description: A contextual decision-support record, not a universal scoring rule.
