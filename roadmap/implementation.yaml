schema_version: 2
status: proposed
roadmap_id: architecture-knowledge-platform
# Baseline 724233c: Atlas workspace/public facade, pinned snapshot and Search/Ask providers implemented.
# M7.3 snapshot validation, local three-guide evaluation, and Atlas API/UI are implemented; focused audit remediation pending.
# This does not change milestone/content approval.
milestones:
  - id: m0
    title: Project Definition
    status: implemented
    dependencies: []
    deliverables:
      - project charter and north star
      - goals and non-goals
      - target product boundaries
      - success criteria
      - strategic roadmap
    exit_criteria:
      - charter and roadmap responsibilities are non-overlapping
      - current implementation status is represented outside the charter
    notes: Project charter accepted by the project owner on 2026-07-29.
  - id: m1
    title: Knowledge Kernel
    status: implemented
    dependencies: [m0]
    deliverables:
      - ontology and taxonomy registries
      - schema contracts
      - identifier and lifecycle rules
      - source, claim, and evidence governance
      - layered repository instructions
    exit_criteria:
      - M1 bootstrap checks pass
      - unresolved taxonomy questions and ontology risks are documented
    notes: Implemented and bootstrap-validated; foundational questions remain open.
  - id: m2
    title: Validation Kernel
    status: implemented
    dependencies: [m1]
    deliverables:
      - pinned pnpm and TypeScript toolchain
      - committed validators and tests
      - valid, invalid, boundary, and regression fixtures
      - CI workflow
      - deterministic integrity reports and freshness checks
    exit_criteria:
      - pnpm install --frozen-lockfile succeeds from a clean workspace
      - pnpm validate passes
      - pnpm test:coverage passes its configured thresholds
      - pnpm test:mutation passes its configured threshold
      - pnpm report:check passes
      - clean-checkout CI passes on Linux and Windows
      - no human-only lifecycle transition can be automated
    notes: Hosted Ubuntu, Windows, and Linux mutation jobs passed for commit c47f391.
  - id: m3
    title: Reference Knowledge Corpus
    status: implemented
    dependencies: [m2]
    deliverables:
      - twenty draft reference knowledge units
      - registered authoritative sources
      - first-class claims
      - typed, conditional relationships
    exit_criteria:
      - every unit passes all validators
      - important claims have admitted evidence
      - references resolve and orphan concepts are explained or corrected
      - no content is marked reviewed, approved, published, or canonical by automation
    notes: Twenty drafted reference units and four proposed supporting failure-mode nodes are machine-valid; final independent regression re-audit recorded M4 READY.
  - id: m4
    title: Knowledge Graph and Query Layer
    status: implemented
    dependencies: [m3]
    deliverables:
      - concept, relationship, source, and claim indexes
      - generated knowledge graph
      - graph traversal CLI or API
      - deterministic generated-artifact checks
      - forward and reverse adjacency
      - provenance and traversal-policy views
      - graph production, coverage, and focused mutation gates
    exit_criteria:
      - graph queries preserve typed relationships and evidence links
      - all production relationships are projected and partitioned into traversable or excluded sets
      - default traversal cannot use proposed, claim-context-only, or explicitly excluded relationships
      - graph artifacts are byte-deterministic and current in clean checkouts
      - exact record, path, provenance, dependent, and structured queries pass regression tests
      - Linux, Windows, legacy mutation, and focused graph mutation pass on the exact implementation SHA
      - no lifecycle status is promoted and M5 capabilities remain out of scope
    notes: Independently audited M5 READY after hardening on commit 7c40879963ffe1c1f647bfa35d36f47045786a8c and exact-SHA hosted run 30800207983. At that historical M4 exit, M5 had not started.
  - id: m5
    title: Search and Hybrid Retrieval
    status: implemented
    dependencies: [m4]
    deliverables:
      - metadata and full-text retrieval
      - semantic retrieval
      - graph expansion and reranking
      - traceable context assembly
    exit_criteria:
      - terminology and semantic queries retrieve relevant concepts
      - evidence and citations remain attached
      - active database generations are fidelity-checked against current repository and graph inputs
      - excluded M4 relationships cannot enter graph expansion
      - retrieval quality and safety metrics are independently auditable
    notes: Implemented with PostgreSQL 16, pgvector 0.8.2, deterministic units, pinned OpenAI embedding contract, fake CI adapter, weighted RRF, bounded graph expansion, and a draft 46-case evaluation corpus. The focused independent evidence re-audit closed M5-AUD-001 and M5-AUD-003, accepted the bounded M5-AUD-002 evidence limitation, and recorded M6 READY; M6 subsequently started in its own scoped run.
  - id: m6
    title: Architecture RAG MVP
    status: implemented
    dependencies: [m5]
    deliverables:
      - ingestion and chunking pipeline
      - hybrid retriever
      - graph-aware context builder
      - citation generator
      - evaluation dataset
      - structured provider and output contracts
      - post-generation grounding validator
      - deterministic and production model adapters
    exit_criteria:
      - answers include resolvable citations
      - retrieval relevance and unsupported claims are measurable
      - recommendations incorporate context and constraints
    notes: Implemented with governed context assembly, structured output, application-resolved citations, epistemic labels, fail-closed grounding, deterministic evaluation, and focused quality gates. The final independent V4 re-audit closed M6-AUD-009 and recorded M6 READY after local and exact-SHA hosted verification. Ansha Cerbia explicitly approved M6 completion and authorized only the bounded M7.0 entry alignment and decision-model audit on 2026-09-01.
  - id: m7
    title: Architecture Decision Assistant
    status: proposed
    dependencies: [m6]
    deliverables:
      - decision-guide schema and semantic validation kernel
      - first-class decision-guide graph and retrieval projection
      - ephemeral session, recommendation, and draft-artifact contracts
      - context and constraint intake
      - option and trade-off analysis
      - risk and evolution-trigger analysis
      - decision-artifact drafting
    exit_criteria:
      - recommendations are contextual and explainable
      - automation cannot approve decisions
    notes: M7.0 is explicitly approved complete. The M7.1 validation kernel is implemented. Ansha Cerbia approved completion of the bounded M7.2 corpus pilot after focused closure confirmation and successful exact-merge CI; the approval is recorded in docs/m7-2-completion-approval.md. Three guides remain proposed; evidence records retain their existing lifecycle states. Milestone approval does not approve guide content or complete all of M7. At baseline 724233c Atlas workspace integration and M6 Search/Ask provider adapters are implemented. The bounded M7.3 plan preserves local, ephemeral evaluation and prohibits external-provider processing. Snapshot validation, local evaluation of all three M7.2 guides, and Atlas API/UI integration are implemented (docs/m7-3-snapshot-validation.md, docs/m7-3-local-evaluator.md, and docs/m7-3-implementation-report.md). The post-merge audit (docs/m7-3-post-merge-audit-report.md) found a medium risk-comparison coverage gap and a low UI/driver wording gap; focused remediation and owner completion remain pending. Broader corpus expansion and artifact generation remain pending.
  - id: m8
    title: Architecture Review Platform
    status: future
    dependencies: [m6, m7]
    deliverables:
      - design artifact review
      - missing-requirement and unsupported-decision detection
      - traceable findings
      - waiver and exception tracking
    exit_criteria:
      - review findings resolve to governed knowledge and evidence
    notes: Requires evaluation against representative review cases.
  - id: m9
    title: Production Knowledge Platform
    status: future
    dependencies: [m8]
    deliverables:
      - documentation website
      - identity and access control
      - ownership and review workflow
      - audit, freshness, observability, feedback, and cost controls
    exit_criteria:
      - operational controls support sustainable organizational use
    notes: Depends on demonstrated value from prior milestones.
