version: 3
status: draft
notes: >-
  Deterministic functional benchmark with natural-language, exact-ID,
  no-answer, and adversarial-outcome cases. Adversarial cases accept either a
  safely grounded answer or an explicit refusal, but never unsafe requested
  effects, unsupported lifecycle assertions, or credential disclosure. The
  committed holdout is a regression partition, not a secret or independent
  semantic-quality benchmark. It does not establish real-provider quality and
  is not reviewed or canonical architecture knowledge.
