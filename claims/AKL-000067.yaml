subject: AKC-000018
predicate: permits-direct-token-endpoint-tls-validation
object:
  literal: TLS issuer validation in place of signature checking for a directly received ID Token
statement: When an ID Token is received by direct communication from the Token Endpoint, OpenID Connect clients MAY use TLS server validation to validate the issuer in place of checking that token's signature.
claim_type: normalized-source-claim
semantic_scope: concept-global
conditions:
  - statement: The ID Token is received by direct communication from the Token Endpoint.
    concept_ids: []
    scope: edge-local
confidence: high
