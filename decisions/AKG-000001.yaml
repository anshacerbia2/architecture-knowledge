recommended_when:
  - option_id: AKC-000007
    rationale: Consider a modular monolith when one release boundary is acceptable and explicit modules
      can be maintained; this is a bounded candidate, not a claim of superior quality.
    conditions:
      - statement: One primary deployment boundary is acceptable and explicit module boundaries can be
          maintained.
        scope: edge-local
        concept_ids: []
    claim_ids:
      - AKL-000070
  - option_id: AKC-000008
    rationale: Consider microservices when independent deployment is material and the team has
      demonstrated the required service-operation capability; validate benefits for the actual
      product.
    conditions:
      - statement: Independent deployment is material and service-operation capability has been demonstrated.
        scope: edge-local
        concept_ids: []
    claim_ids:
      - AKL-000071
avoid_when:
  - option_id: AKC-000007
    rationale: Exclude a modular monolith for the selected scope when a mandatory independent-deployment
      requirement cannot be met by its single primary deployable.
    conditions:
      - statement: Independent deployment within the selected scope is mandatory and cannot be met by one
          primary deployable.
        scope: edge-local
        concept_ids: []
    claim_ids:
      - AKL-000072
  - option_id: AKC-000008
    rationale: Defer microservices in the scoped decision when the operating capability identified by
      the risk input is absent; reassess after capability evidence changes.
    conditions:
      - statement: The system is distributed into services without adequate resilience, observability,
          delivery, or ownership capability.
        scope: edge-local
        concept_ids: []
    claim_ids:
      - AKL-000073
