id: AKG-000001
record_kind: decision-guide
title: Deployment boundary selection
decision_question: For one product scope, should deployment remain one primary unit or use
  independently deployable services? This is not a choice of internal ports/adapters or messaging
  style.
context_variables:
  - key: decision-scope
    question: What exact system, call boundary, or inquiry is being decided?
    description: Human-provided, scoped pilot context; no secrets or personal data. This text is not an
      automatically evaluated condition.
    value_type: string
    required: true
    sensitivity: internal
    unit: null
    allowed_values: []
  - key: deployment-needs
    question: Which independent-release requirements are mandatory, and is one deployment boundary
      acceptable?
    description: Human-provided, scoped pilot context; no secrets or personal data. This text is not an
      automatically evaluated condition.
    value_type: string
    required: true
    sensitivity: internal
    unit: null
    allowed_values: []
  - key: operating-capability
    question: What evidence demonstrates service ownership, delivery, failure handling, and operational
      capability?
    description: Human-provided, scoped pilot context; no secrets or personal data. This text is not an
      automatically evaluated condition.
    value_type: string
    required: true
    sensitivity: internal
    unit: null
    allowed_values: []
