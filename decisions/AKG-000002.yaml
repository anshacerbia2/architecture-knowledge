    conditions: []
    claim_ids:
      - AKL-000082
options:
  - concept_id: AKC-000012
    label: Retry
    summary: A retry policy repeats an operation for failures classified as transient and should bound
      attempts, delay, and total elapsed time.
    conditions: []
    claim_ids:
      - AKL-000012
  - concept_id: AKC-000013
    label: Circuit Breaker
    summary: A circuit breaker transitions among closed, open, and probe states to prevent repeated
      calls to a failing dependency and test recovery.
    conditions: []
    claim_ids:
      - AKL-000013
evaluation_criteria:
  - key: mechanism
    question: Does the failure profile call for another attempt, suppressing calls, or both?
    quality_attribute_id: null
    scale: qualitative
    direction: context-dependent
    unit: null
    conditions:
      - statement: Failure classification, attempt budgets, and breaker state are coordinated.
        concept_ids: []
        scope: edge-local
    claim_ids:
      - AKL-000028
  - key: availability-effect
    question: What conditional availability-related mechanism is supported, without claiming a measured gain?
    quality_attribute_id: AKC-000004
    scale: qualitative
    direction: context-dependent
    unit: null
    conditions: []
    claim_ids:
      - AKL-000082
tradeoff_matrix:
  - option_id: AKC-000012
    criterion: mechanism
    assessment:
      rating: mixed
      rationale: Retry repeats transiently failing operations within bounded time and attempt policies.
      value: null
      unit: null
      uncertainty: high
    conditions: []
    claim_ids:
      - AKL-000012
  - option_id: AKC-000013
    criterion: mechanism
    assessment:
      rating: mixed
      rationale: A breaker blocks dependency calls when open and probes for recovery; it does not repeat
        the business operation by itself.
      value: null
      unit: null
      uncertainty: high
    conditions: []
    claim_ids:
      - AKL-000013
  - option_id: AKC-000012
    criterion: availability-effect
    assessment:
      rating: unknown
      rationale: The bounded retry recommendation pursues service success; its availability gain is
        unmeasured for this caller.
      value: null
      unit: null
      uncertainty: unresolved
    conditions:
      - statement: Failures are transient, attempts fit the end-to-end deadline, and retry load remains
          within capacity.
        concept_ids: []
        scope: edge-local
    claim_ids:
      - AKL-000026
  - option_id: AKC-000013
    criterion: availability-effect
    assessment:
      rating: unknown
      rationale: Capacity containment is a low-confidence inference, not proof of an availability target.
      value: null
      unit: null
      uncertainty: unresolved
    conditions:
      - statement: The dependency failure would otherwise consume shared capacity and the caller has an
          acceptable open-state response.
        concept_ids: []
        scope: edge-local
    claim_ids:
      - AKL-000027
disqualifiers: []
risk_questions:
  - question: Have ambiguity, harmful duplicate effects, aggregate retry load, nested policies, and
      deadline exhaustion been tested?
    affected_option_ids:
      - AKC-000012
    conditions:
      - statement: Failures are transient, attempts fit the end-to-end deadline, and retry load remains
          within capacity.
        concept_ids: []
        scope: edge-local
    claim_ids:
      - AKL-000026
  - question: Can the caller tolerate the blocked-call response and verify recovery probes without
      assuming recovery is guaranteed?
    affected_option_ids:
      - AKC-000013
    conditions: []
    claim_ids:
      - AKL-000013
recommended_when:
  - option_id: AKC-000012
    rationale: Use a bounded retry policy to pursue service success only when failures are transient,
      repetition is safe, attempts fit the deadline, and aggregate retry load stays within capacity.
    conditions:
      - statement: Failures are transient, attempts fit the end-to-end deadline, and retry load remains
          within capacity.
        concept_ids: []
        scope: edge-local
      - statement: Repetition of the scoped operation is safe, including after an ambiguous completion.
        scope: edge-local
        concept_ids: []
      - statement: Failure classification, attempt budgets, and breaker state are coordinated.
        scope: edge-local
        concept_ids: []
    claim_ids:
      - AKL-000026
      - AKL-000028
  - option_id: AKC-000013
    rationale: Consider a circuit breaker to contain dependency-call resource consumption when the
      caller can accept its open-state response; this is not a measured availability guarantee.
    conditions:
      - statement: Failure classification, attempt budgets, and breaker state are coordinated.
        scope: edge-local
        concept_ids: []
      - statement: The dependency failure would otherwise consume shared capacity and the caller has an
          acceptable open-state response.
        scope: edge-local
        concept_ids: []
    claim_ids:
      - AKL-000075
      - AKL-000028
avoid_when:
  - option_id: AKC-000012
    rationale: Avoid retrying the current operation when it is not safely repeatable or when no attempts
      fit the caller's deadline and load budget.
    conditions:
      - statement: The current operation is not safely repeatable or no attempts fit its deadline and load
          budget.
        scope: edge-local
        concept_ids: []
    claim_ids:
      - AKL-000074
  - option_id: AKC-000013
    rationale: Do not select a circuit breaker for this call boundary until the caller has an acceptable
      response while dependency calls are blocked.
    conditions:
      - statement: No acceptable caller response exists while the breaker blocks dependency calls.
        scope: edge-local
        concept_ids: []
    claim_ids:
      - AKL-000076
evolution_triggers:
  - condition:
      statement: Observed failures no longer fit the transient-failure policy.
      scope: edge-local
      concept_ids: []
    rationale: Revisit retry eligibility and budgets with observed failure evidence.
    affected_option_ids:
