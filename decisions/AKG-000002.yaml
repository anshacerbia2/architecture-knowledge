schema_version: 4
id: AKG-000002
record_kind: decision-guide
title: Dependency fault-response selection
decision_question: At a named dependency-call boundary, is bounded retry, circuit breaking, or a
  coordinated combination applicable? These controls are complementary, not interchangeable.
context_variables:
  - key: decision-scope
    question: What exact system, call boundary, or inquiry is being decided?
    description: Human-provided, scoped pilot context; no secrets or personal data. This text is not an
      automatically evaluated condition.
    value_type: string
    required: true
    sensitivity: internal
    unit: null
    allowed_values: []
  - key: failure-profile
    question: Which failures are transient and which persist or consume shared capacity?
    description: Human-provided, scoped pilot context; no secrets or personal data. This text is not an
      automatically evaluated condition.
    value_type: string
    required: true
    sensitivity: internal
    unit: null
    allowed_values: []
  - key: caller-budget
    question: What deadline, aggregate attempt budget, and duplicate-effect safeguards apply?
    description: Human-provided, scoped pilot context; no secrets or personal data. This text is not an
      automatically evaluated condition.
    value_type: string
    required: true
    sensitivity: internal
    unit: null
    allowed_values: []
  - key: open-state-response
    question: What caller response is acceptable while calls are blocked?
    description: Human-provided, scoped pilot context; no secrets or personal data. This text is not an
      automatically evaluated condition.
    value_type: string
    required: true
    sensitivity: internal
    unit: null
    allowed_values: []
constraints:
  - concept_id: AKC-000003
    hardness: hard
    rationale: "Pilot scope constraint: The decision concerns one named dependency-call boundary with
      caller deadline, duplicate-effect safety, and acceptable failure-response limits recorded. The
      generic Constraint concept classifies this single explicitly qualified binding; it does not
      prove project compliance or represent several independently checkable constraints."
    conditions:
      - statement: The decision concerns one named dependency-call boundary with caller deadline,
          duplicate-effect safety, and acceptable failure-response limits recorded.
        scope: edge-local
        concept_ids: []
    claim_ids:
      - AKL-000081
assumptions: []
quality_attributes:
  - concept_id: AKC-000004
