recommended_when:
  - option_id: AKC-000001
    rationale: Consider bounded premise examination when a material architecture premise is uncertain;
      the software-method transfer remains a low-confidence repository recommendation.
    conditions:
      - statement: A material architecture premise is uncertain and premise examination is within the
          inquiry scope.
        scope: edge-local
        concept_ids: []
    claim_ids:
      - AKL-000077
  - option_id: AKC-000002
    rationale: Consider systems thinking when the architecture inquiry must examine material
      interactions across boundaries or lifecycle stages.
    conditions:
      - statement: The inquiry includes material cross-boundary interactions or lifecycle consequences.
        scope: edge-local
        concept_ids: []
    claim_ids:
      - AKL-000078
avoid_when:
  - option_id: AKC-000001
    rationale: Avoid using premise examination as the sole inquiry lens when that choice would leave
      required cross-boundary analysis unaddressed.
    conditions:
      - statement: Premise examination would be the sole lens and required cross-boundary analysis would
          remain unaddressed.
        scope: edge-local
        concept_ids: []
    claim_ids:
      - AKL-000079
  - option_id: AKC-000002
    rationale: Avoid using an interaction-oriented analysis as the sole inquiry lens when it leaves a
      material uncertain premise unexamined.
    conditions:
      - statement: Interaction analysis would be the sole lens and a material uncertain premise would remain
          unexamined.
        scope: edge-local
        concept_ids: []
    claim_ids:
      - AKL-000080
