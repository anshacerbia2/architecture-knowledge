schema_version: 4
id: AKG-000003
record_kind: decision-guide
title: Service-availability inquiry lens selection
decision_question: For a bounded service-availability inquiry, which lenses should examine uncertain
  premises and cross-boundary behavior? First-principles and systems thinking may be combined;
  neither is an implementation architecture or proof of an availability improvement.
context_variables:
  - key: decision-scope
    question: What exact system, call boundary, or inquiry is being decided?
    description: Human-provided, scoped pilot context; no secrets or personal data. This text is not an
      automatically evaluated condition.
    value_type: string
    required: true
    sensitivity: internal
    unit: null
    allowed_values: []
  - key: premise-uncertainty
    question: Which material premises need examination and what could refute them?
    description: Human-provided, scoped pilot context; no secrets or personal data. This text is not an
      automatically evaluated condition.
    value_type: string
    required: true
    sensitivity: internal
    unit: null
    allowed_values: []
  - key: interaction-scope
    question: Which stakeholder, feedback, boundary, or lifecycle interactions must be examined?
    description: Human-provided, scoped pilot context; no secrets or personal data. This text is not an
      automatically evaluated condition.
    value_type: string
    required: true
    sensitivity: internal
    unit: null
    allowed_values: []
  - key: analysis-plan
    question: Will each required analysis be covered by a single lens or a coordinated combination?
    description: Human-provided, scoped pilot context; no secrets or personal data. This text is not an
      automatically evaluated condition.
    value_type: string
    required: true
    sensitivity: internal
    unit: null
    allowed_values: []
constraints:
  - concept_id: AKC-000003
    hardness: hard
    rationale: "Pilot scope constraint: The inquiry has a named service-availability question and bounded
      analysis scope; no inquiry result is treated as proof or an accepted architecture decision.
      The generic Constraint concept classifies this single explicitly qualified binding; it does
      not prove project compliance or represent several independently checkable constraints."
    conditions:
